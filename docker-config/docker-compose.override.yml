services:
  postgres:
    container_name: postgres_container
    ports:
      - "5432:5432"

  golang:
    container_name: golang_container
    volumes:
      - ../backend:/app
    ports:
      - "8080:8080"

  react:
    container_name: react_container
    volumes:
      - ../frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      CHOKIDAR_USEPOLLING=true