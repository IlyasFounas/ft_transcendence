services:
  postgres:
    container_name: postgres_container
    networks:
      - ft_transcendence

  golang:
    container_name: golang_container
    volumes:
      - ../backend:/app
    networks:
      - ft_transcendence

  react:
    container_name: react_container
    volumes:
      - ../frontend:/app
      - /app/node_modules
    networks:
      - ft_transcendence
    environment:
      CHOKIDAR_USEPOLLING=true

  nginx:
    ports:
      - "5130:5130"
    networks:
      - ft_transcendence

networks:
  ft_transcendence:
    driver: bridge
