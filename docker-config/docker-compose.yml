services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres_container
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  golang:
    build: ../backend
    container_name: golang_container
    working_dir: /app
    volumes:
      - ../backend:/app
    ports:
      - "8080:8080"
    command: air

  react:
    build: ../frontend
    container_name: react_container
    working_dir: /app
    volumes:
      - ../frontend:/app
      - /app/node_modules  # Important : préserve node_modules du conteneur
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true  # Pour le hot-reload avec Docker
    depends_on:
      - golang
    stdin_open: true  # Pour React
    tty: true         # Pour React

volumes:
  postgres_data: