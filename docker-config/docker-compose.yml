# Best practices for Docker management are to use separate docker-compose.yml files:
# - one for base services that creates the basic containers
# - one for the dev environment to set up the network, initialize containers with hot reloading, etc. (docker-compose.override.yml)
# - one for production with compiled code, and nginx listening on ports 443 and 80 (docker-compose.prod.yml)
services:

  # Basic PostgreSQL container
  # Docker manages the volume automatically
  # Only necessary environment variables are provided, not the entire .env file
  # Healthcheck ensures the database is fully launched
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: /run/secrets/postgres_password
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Golang container to run the backend
  # `go mod tidy` cleans unused dependencies and optimizes dependencies in go.mod
  # Air provides hot reload, monitoring all files in backend/
  # and automatically rebuilds when changes are detected
  golang:
    build:
      context: ../backend
      target: ${ENV}
    working_dir: /app
    environment:
      ACTIVATION_JWT_SECRET_FILE: /run/secrets/activation_jwt_secret
      JWT_SECRET_FILE: /run/secrets/jwt_secret
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432 
      ENV: ${ENV}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET_FILE: /run/secrets/google_client_secret
      GOOGLE_REDIRECT_URL: ${GOOGLE_REDIRECT_URL}
      LOCATION_FILE_PATH: ${LOCATION_FILE_PATH}
      ADMIN_USERNAME_FILE: /run/secrets/admin_username
      ADMIN_EMAIL_FILE: /run/secrets/admin_email
      ADMIN_PASSWORD_FILE: /run/secrets/admin_password
    secrets:
      - activation_jwt_secret
      - jwt_secret
      - postgres_password
      - google_client_secret
      - admin_username
      - admin_email
      - admin_password
    depends_on:
      postgres:
        condition: service_healthy

  # React container to run the frontend
  # Features hot reload
  # `NODE_ENV` is useful in the code
  # If `NODE_ENV=development`, allows insecure methods or features/tokens that won't exist in production
  # so it's useful to check this variable
  react:
    build:
      context: ../frontend 
      target: ${ENV}
    working_dir: /app
    environment:
      ENV: ${ENV}
      VITE_MAPILLARY_ACCESS_TOKEN_FILE: /run/secrets/mapillary_token
    secrets:
      - mapillary_token
    depends_on:
      - golang
    stdin_open: true
    tty: true

  # Nginx acts as a reverse proxy
  # It routes requests from clients or frontend to the appropriate containers
  # routing to either localhost:8080/ or localhost:3000/
  # This is a realistic way to develop, as production uses the same setup
  # Including it in dev prevents production bugs
  # nginx:
  #   build:
  #     context: ../nginx
  #     target: ${ENV}
  nginx:
    build:
      context: ../nginx
      target: ${ENV}
    depends_on:
      - golang


volumes:
  postgres_data:

secrets:
  activation_jwt_secret:
    file: ../secrets/jwt/activation/secret.txt
  jwt_secret:
    file: ../secrets/jwt/secret.txt
  postgres_password:
    file: ../secrets/postgres/password.txt
  google_client_secret:
    file: ../secrets/google/secret.txt
  admin_username:
    file: ../secrets/admin/username.txt
  admin_email:
    file: ../secrets/admin/email.txt
  admin_password:
    file: ../secrets/admin/password.txt
  mapillary_token:
    file: ../secrets/mapillary/access_token.txt