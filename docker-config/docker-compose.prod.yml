services:
  postgres:
    container_name: postgres_container
    networks:
      - database

  # For Golang and React, volumes mount the code directories (backend and frontend)
  # since the containers execute the code
  golang:
    environment:
      RESEND_API_KEY: ${RESEND_API_KEY}
    container_name: golang_container
    networks:
      - app
      - database

  react:
    build:
      context: ../frontend
      target: ${ENV}
      args:
        VITE_MAPILLARY_ACCESS_TOKEN: ${MAPILLARY_ACCESS_TOKEN}
    container_name: react_container
    networks:
      - app

  nginx:
    container_name: nginx_container
    ports:
      - "127.0.0.1:8082:80"
    networks:
      - app

# Simple network that may be enhanced for production
networks:
  app:
    driver: bridge
  database:
    driver: bridge
