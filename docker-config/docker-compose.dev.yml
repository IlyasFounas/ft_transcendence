services:
  postgres:
    container_name: postgres_container
    ports:
      - "5432:5432"
    networks:
      - ft_transcendence

  # For Golang and React, volumes mount the code directories (backend and frontend)
  # since the containers execute the code
  golang:
    container_name: golang_container
    volumes:
      - ../backend:/app
    networks:
      - ft_transcendence
    # env_file:
    #   - ../backend/.env
    # stop_grace_period: 15s //possible option to set a longer period for graceful shutdown if necessary

  # CHOKIDAR enables hot reload for the frontend
  # CHOKIDAR_USEPOLLING=true allows the dev environment to run on different OS (Windows, macOS), but this option uses more resources
  react:
    container_name: react_container
    volumes:
      - ../frontend:/app
      - /app/node_modules
    networks:
      - ft_transcendence
    environment:
      - CHOKIDAR_USEPOLLING=true
    stdin_open: true
    tty: true

  nginx:
    container_name: nginx_container
    ports:
      - "5130:5130"
    networks:
      - ft_transcendence
  
  adminer:
    image: adminer:latest
    restart: unless-stopped
    ports:
      - "8082:8080"
    networks:
      - ft_transcendence
  
  mailpit:
    image: axllent/mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"
    networks:
      - ft_transcendence

# Simple network that may be enhanced for production
networks:
  ft_transcendence:
    driver: bridge
