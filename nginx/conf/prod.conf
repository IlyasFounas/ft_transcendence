server {
    listen 5130;
    listen 8082;

    # todo later : put a real tls process + the certificate
    location /api/ {
        proxy_pass http://golang:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    
    location / {
        proxy_pass http://react:80/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location ~ /\.ht {
        deny all;
    }
}