server {
    listen 80 default_server;

    server_name _;

    return 301 https://localhost:443;
}

server {
    listen 443 ssl;

    ssl_certificate     /etc/nginx/ssl/ifounas.crt;
    ssl_certificate_key /etc/nginx/ssl/ifounas.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    
    # todo later : put a real tls process + the certificate
    location /api/ {
        proxy_pass http://golang:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    
    location / {
        proxy_pass http://react:80/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location ~ /\.ht {
        deny all;
    }
}